<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="earthGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="starlinkLogoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="800" height="500" fill="url(#spaceGrad)" rx="16" />

  <!-- Stars -->
  <circle cx="80" cy="60" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="150" cy="120" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="260" cy="80" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="340" cy="180" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="450" cy="90" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="580" cy="140" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="690" cy="70" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="750" cy="190" r="1" fill="#ffffff" opacity="0.5" />

  <!-- Earth Atmospheric Limb -->
  <path d="M-100 520 Q400 360 900 520" fill="url(#earthGlow)" />
  <path d="M-100 525 Q400 365 900 525" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Orbit Path & Constellation Satellites -->
  <path d="M-50 280 Q400 120 850 300" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" fill="none" opacity="0.7" />

  <!-- Satellites on Orbit -->
  <!-- Sat 1 -->
  <g transform="translate(220, 205)">
    <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#38bdf8" />
    <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#e2e8f0" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <!-- signal wave -->
    <path d="M-10 12 Q0 20 10 12" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.8" />
  </g>
  
  <!-- Sat 2 (Center highlight) -->
  <g transform="translate(410, 168)">
    <rect x="-18" y="-4" width="36" height="8" rx="2" fill="#38bdf8" />
    <rect x="-4" y="-16" width="8" height="32" rx="2" fill="#f8fafc" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <path d="M-15 16 Q0 28 15 16" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path d="M-22 22 Q0 38 22 22" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6" />
  </g>

  <!-- Sat 3 -->
  <g transform="translate(600, 215)">
    <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#38bdf8" />
    <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#e2e8f0" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Starlink UI Overlay -->
  <g transform="translate(50, 40)">
    <text x="0" y="30" fill="url(#starlinkLogoGrad)" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="8">STARLINK</text>
    <text x="0" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">CONECTIVIDAD GLOBAL DE ALTA VELOCIDAD</text>

    <!-- Telemetry Badges -->
    <g transform="translate(0, 90)">
      <rect width="130" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">VELOCIDAD</text>
      <text x="14" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">220+ Mbps</text>
    </g>

    <g transform="translate(145, 90)">
      <rect width="130" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">LATENCIA</text>
      <text x="14" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">&lt; 25 ms</text>
    </g>
  </g>
</svg>
