<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16" />

  <!-- Grid decoration lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" />
  <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Form Container Mockup -->
  <g transform="translate(180, 50)">
    <rect width="440" height="400" rx="14" fill="#0b1329" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Header -->
    <rect width="440" height="50" rx="14" fill="#132347" />
    <circle cx="30" cy="25" r="6" fill="#ef4444" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />
    <text x="220" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Formulario Interactivo JS</text>

    <!-- Field 1: Nombre -->
    <text x="40" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Nombre Completo</text>
    <rect x="40" y="100" width="360" height="38" rx="8" fill="url(#inputGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="124" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Rachel Sánchez</text>
    <circle cx="380" cy="119" r="8" fill="#10b981" />
    <path d="M376 119 L379 122 L385 116" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Field 2: Email -->
    <text x="40" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Correo Electrónico</text>
    <rect x="40" y="175" width="360" height="38" rx="8" fill="url(#inputGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="199" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">rachel@desarrollo.dev</text>
    <circle cx="380" cy="194" r="8" fill="#10b981" />
    <path d="M376 194 L379 197 L385 191" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Field 3: Password / Validación -->
    <text x="40" y="240" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Contraseña Segura (Validación Regex)</text>
    <rect x="40" y="250" width="360" height="38" rx="8" fill="url(#inputGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="274" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">••••••••••••••••</text>
    <circle cx="380" cy="269" r="8" fill="#10b981" />
    <path d="M376 269 L379 272 L385 266" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Strength indicator -->
    <rect x="40" y="300" width="85" height="4" rx="2" fill="#10b981" />
    <rect x="130" y="300" width="85" height="4" rx="2" fill="#10b981" />
    <rect x="220" y="300" width="85" height="4" rx="2" fill="#10b981" />
    <rect x="310" y="300" width="85" height="4" rx="2" fill="#10b981" />
    <text x="40" y="318" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">✓ Validación en tiempo real cumplida</text>

    <!-- Button -->
    <rect x="40" y="335" width="360" height="42" rx="8" fill="#0284c7" filter="url(#glow)" />
    <text x="220" y="361" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Validar y Enviar Datos</text>
  </g>
</svg>
