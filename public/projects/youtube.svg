<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ytBg)" rx="16" />

  <!-- App Header -->
  <rect x="20" y="20" width="760" height="46" rx="10" fill="#111827" stroke="#374151" stroke-width="1" />
  
  <!-- Youtube Logo -->
  <rect x="40" y="32" width="30" height="22" rx="6" fill="url(#redAccent)" />
  <polygon points="52,38 52,48 61,43" fill="#ffffff" />
  <text x="78" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">YouTube</text>
  <text x="146" y="41" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">CLONE</text>

  <!-- Search Bar -->
  <rect x="240" y="27" width="320" height="32" rx="16" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="260" y="48" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Buscar videos, tutoriales de JavaScript...</text>
  <rect x="520" y="27" width="40" height="32" rx="0 16 16 0" fill="#374151" />
  <circle cx="538" cy="42" r="5" stroke="#cbd5e1" stroke-width="1.5" fill="none" />
  <line x1="542" y1="46" x2="548" y2="52" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Avatar -->
  <circle cx="750" cy="43" r="14" fill="#38bdf8" />
  <text x="750" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R</text>

  <!-- Sidebar -->
  <g transform="translate(20, 80)">
    <rect width="70" height="390" rx="10" fill="#111827" />
    <circle cx="35" cy="40" r="12" fill="#1e293b" />
    <text x="35" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Inicio</text>
    <circle cx="35" cy="110" r="12" fill="#1e293b" />
    <text x="35" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Shorts</text>
    <circle cx="35" cy="180" r="12" fill="#1e293b" />
    <text x="35" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Subs</text>
    <circle cx="35" cy="250" r="12" fill="#1e293b" />
    <text x="35" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Biblioteca</text>
  </g>

  <!-- Main Video Player -->
  <g transform="translate(105, 80)">
    <rect width="440" height="260" rx="12" fill="#000000" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Big Play Icon -->
    <circle cx="220" cy="130" r="32" fill="url(#redAccent)" opacity="0.9" />
    <polygon points="212,116 212,144 236,130" fill="#ffffff" />
    <!-- Video Title & Meta -->
    <text x="0" y="290" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Next.js &amp; JavaScript Moderno para Desarrolladores</text>
    <text x="0" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Rachel Sánchez • 120k vistas • hace 3 días</text>
    <!-- Video Tags -->
    <rect x="0" y="335" width="80" height="24" rx="12" fill="#1e293b" />
    <text x="40" y="351" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">React 19</text>
    <rect x="90" y="335" width="90" height="24" rx="12" fill="#1e293b" />
    <text x="135" y="351" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">TailwindCSS</text>
  </g>

  <!-- Side Playlist / Recommended -->
  <g transform="translate(560, 80)">
    <rect width="220" height="110" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect x="10" y="10" width="90" height="60" rx="6" fill="#1e293b" />
    <polygon points="50,34 50,46 60,40" fill="#ef4444" />
    <text x="110" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DOM Mastery</text>
    <text x="110" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">JavaScript Puro</text>
    <text x="110" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">18:24</text>

    <rect y="125" width="220" height="110" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect x="10" y="135" width="90" height="60" rx="6" fill="#1e293b" />
    <polygon points="50,159 50,171 60,165" fill="#ef4444" />
    <text x="110" y="151" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Async / Await</text>
    <text x="110" y="169" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Promesas en JS</text>
    <text x="110" y="185" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">24:10</text>
  </g>
</svg>
